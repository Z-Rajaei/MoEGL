# ModelSet classification, encoding B/C: structure + element names encoded with WordE4MDE.
# The same file is used for the homogeneous (NetworkX) and heterogeneous (HPyG) variants;
# the experiment script switches output.format.
input:
  format: "ecore"
  metamodelpath: ""
  modelspath: "E:/Project/ModelSet/prepared/models"
output:
  format: "HPyG"
adaptations:
  metamodels:
    packages:
      ecore:
        uri:
          http://www.eclipse.org/emf/2002/Ecore:
            classes:
              include: ["EPackage", "EClassifier", "EStructuralFeature", "EEnumLiteral", "EOperation", "EParameter"]
              includeAllAttributes: false
              ENamedElement:
                include: ["name"]
                features:
                  name:
                    encoding: "worde4mde"
              EPackage:
                include: ["eClassifiers", "eSubpackages"]
              EClass:
                include: ["eStructuralFeatures", "eSuperTypes", "eOperations"]
              EEnum:
                include: ["eLiterals"]
              ETypedElement:
                include: ["eType"]
              EReference:
                include: ["eOpposite"]
              EOperation:
                include: ["eParameters"]
