# A second configuration for the same Ecore dataset, used to measure MoEGL's re-encoding time from the
# Stage 1 cache: same as exp1_lopez_ecore.yaml but data types / enum literals are dropped and class
# names are kept (word2vec-encoded), i.e. a typical "second pass" while iterating on an encoding.
input:
  format: "ecore"
  metamodelpath: ""
  modelspath: "E:/Project/TCRMG-GNN-1.0.0/realModels/Ecore"
output:
  format: "NetworkX"
adaptations:
  metamodels:
    packages:
      ecore:
        uri:
          http://www.eclipse.org/emf/2002/Ecore:
            classes:
              include: ["EClass", "EStructuralFeature", "EPackage"]
              exclude: ["EDataType", "EEnum", "EEnumLiteral"]
              includeAllAttributes: false
              EPackage:
                include: ["eClassifiers"]
              EClass:
                include: ["ePackage", "eStructuralFeatures", "eSuperTypes", "name"]
                features:
                  name:
                    encoding: "word2vec"
              EStructuralFeature:
                include: ["eContainingClass", "eType"]
              EReference:
                include: ["eContainingClass", "eType", "eOpposite"]
